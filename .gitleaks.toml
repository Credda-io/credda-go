# gitleaks configuration for credda-go.
#
# GitHub's secret scanning and push protection are not enabled on this
# repository, so the CI job in .github/workflows/ci.yml is the only thing
# standing between a committed credential and a public repo. It has to stay
# green to be worth anything, which means a known false positive is recorded
# here rather than left to train everyone to ignore a red run.

[extend]
useDefault = true

# There is no allowlist, and that is the current state rather than a policy.
#
# The previous one exempted `idempotency`-matching lines in client_test.go: the
# retired trust client sent an Idempotency-Key on its event-reporting POST, and
# the fixture values tripped the generic-api-key heuristic on entropy alone.
# That surface is gone. The engine API accepts no idempotency key on its one
# POST route, so no such fixture exists and the exemption was covering nothing.
#
# Every test in this package runs against httptest.NewServer and authenticates
# against nothing; the only bearer token in the tree is the literal "test-key".
# If a future fixture trips the scanner, add the narrowest possible path-and-
# regex allowlist here with the reason, rather than widening this file.
