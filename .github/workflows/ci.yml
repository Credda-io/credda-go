name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.21'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...

      # `go test ./...` PRINTS "no test files" AND EXITS 0.
      #
      # That is the shape this tree keeps finding: a gate that passes by not
      # executing. Rename the package, drop the files into a directory `./...`
      # no longer reaches, or land a build tag that excludes every `_test.go`,
      # and this step stays green having asserted nothing at all. `-v` makes
      # the run enumerate what it collected and the count is asserted after the
      # fact, which is the same after-the-fact proof core's CI uses for its
      # vitest steps.
      #
      # `-count=1` also disables Go's test cache, so a green tick here is a run
      # of this commit rather than a replay of an older one.
      - name: Test, and prove tests actually ran
        run: |
          set -euo pipefail
          go test -count=1 -v ./... | tee /tmp/go-test.txt
          ran=$(grep -c '^=== RUN' /tmp/go-test.txt || true)
          echo "top-level test functions collected: $ran"
          if [ "${ran:-0}" -eq 0 ]; then
            echo '::error::go test collected no tests. `go test ./...` exits 0 when a package has no test files, so this step would otherwise be a green tick over an unrun suite. Find where the _test.go files went before trusting this job again.'
            exit 1
          fi

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # GitHub's own secret scanning and push protection are not enabled on this
      # repo, so the scan runs here instead. The gitleaks container is used
      # directly rather than gitleaks-action, which needs an org licence key.
      # PINNED BY DIGEST, and `:latest` is why.
      #
      # This step used to pull `zricethezav/gitleaks:latest`, so the ruleset
      # this gate enforces changed whenever upstream published, with no commit
      # in this repository and nothing to bisect. That is the same class as an
      # unpinned action: the check does not mean the same thing on two runs of
      # the same tree. The digest below is the multi-arch index for v8.30.1,
      # resolved 2026-09-21; `detect --source` is still the supported spelling
      # at that version (verified by running it). Bump it deliberately.
      - name: Scan the full history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --no-banner --verbose
